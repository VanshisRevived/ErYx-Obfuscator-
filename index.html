<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErYx Obfuscator | Access Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 255, 170, 0.05);
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #66fcf1;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #a0aab2;
            margin-bottom: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 6px;
            color: #66fcf1;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="password"]:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px rgba(102, 252, 241, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #45a29e;
            border: none;
            border-radius: 6px;
            color: #0b0c10;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover { background: #66fcf1; }
        .output-box {
            margin-top: 1.5rem;
            background: #0b0c10;
            border: 1px solid #1f2833;
            border-radius: 6px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-align: left;
            word-break: break-all;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .success { color: #66fcf1; border-color: #45a29e; }
        .error { color: #ff4d4d; border-color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">ErYx</div>
        <div class="subtitle">Protected Code Vault</div>
        
        <div class="input-group">
            <input type="password" id="keyInput" placeholder="Enter Access Password...">
        </div>
        <button onclick="unlockScript()">Unlock Payload</button>

        <div id="outputBox" class="output-box"></div>
    </div>

    <script>
        async function unlockScript() {
            const key = document.getElementById('keyInput').value;
            const output = document.getElementById('outputBox');
            
            output.style.display = 'block';
            output.className = 'output-box';
            output.textContent = 'Verifying key against ErYx runtime...';

            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: key })
            });

            if (response.ok) {
                const scriptText = await response.text();
                output.classList.add('success');
                output.textContent = scriptText;
            } else {
                output.classList.add('error');
                output.textContent = 'Access Denied: Invalid Password Key.';
            }
        }
    </script>
</body>
</html>
