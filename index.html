<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Script Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0f12;
            color: #e1e6ed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 { font-size: 1.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
        p { font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem; }
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            background: #0d0f12;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            margin-bottom: 1rem;
            outline: none;
        }
        input[type="password"]:focus { border-color: #58a6ff; }
        button {
            width: 100%;
            padding: 10px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .output {
            margin-top: 1rem;
            background: #0d0f12;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            text-align: left;
            display: none;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .error { color: #f85149; border-color: #f85149; }
        .success { color: #3fb950; border-color: #238636; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="scriptTitle">Loading...</h2>
        <p>This script is protected. Enter password to view source.</p>
        
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="unlock()">Unlock Script</button>

        <div id="output" class="output"></div>
    </div>

    <script>
        // Fetch script name on load
        fetch('/api/info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('scriptTitle').textContent = data.name;
            });

        async function unlock() {
            const password = document.getElementById('passInput').value;
            const output = document.getElementById('output');

            output.style.display = 'block';
            output.className = 'output';
            output.textContent = 'Verifying...';

            const response = await fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            if (response.ok) {
                const text = await response.text();
                output.classList.add('success');
                output.textContent = text;
            } else {
                output.classList.add('error');
                output.textContent = 'Access Denied: Incorrect Password';
            }
        }
    </script>
</body>
</html>
